<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>eFootball Championship Manager</title>

<style>
:root{
    --bg-dark:#0a0b10;
    --panel-bg:#141722;
    --accent-neon:#00ff88;
    --accent-blue:#00e5ff;
    --text-main:#ffffff;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Segoe UI,Tahoma,sans-serif;
}

body{
    background:var(--bg-dark);
    color:var(--text-main);
    padding:10px;
}

.container{
    max-width:900px;
    margin:auto;
}

header{
    text-align:center;
    margin-bottom:15px;
}

h1{
    color:var(--accent-neon);
}

.section-panel{
    background:var(--panel-bg);
    padding:15px;
    border-radius:10px;
    margin-bottom:15px;
    border:1px solid #2a3142;
}

.nav-tabs{
    display:flex;
    gap:8px;
    margin-bottom:15px;
}

.tab-btn{
    flex:1;
    padding:10px;
    border:none;
    border-radius:6px;
    background:#1e2333;
    color:white;
    cursor:pointer;
}

.tab-btn.active{
    background:var(--accent-blue);
    color:black;
    font-weight:bold;
}

.page{
    display:none;
}

.page.active{
    display:block;
}

.table-wrapper{
    overflow-x:auto;
}

table{
    width:100%;
    border-collapse:collapse;
}

th,td{
    padding:8px;
    border-bottom:1px solid #2a3142;
    text-align:center;
}

th{
    background:#1e2333;
    color:var(--accent-neon);
}

#standings-body tr:nth-child(-n+8){
    border-left:4px solid var(--accent-neon);
}

.match-card{
    background:#1a1e2d;
    padding:12px;
    border-radius:10px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
}

.match-teams{
    display:flex;
    align-items:center;
    gap:8px;
}

.match-teams.away{
    flex-direction:row-reverse;
}

.team-logo{
    width:24px;
    height:24px;
    border-radius:50%;
}

.score-box{
    display:flex;
    align-items:center;
    gap:5px;
}

.score-input{
    width:45px;
    text-align:center;
    padding:5px;
    background:#0b0d14;
    color:white;
    border:1px solid #3a445d;
    border-radius:5px;
}

@media(max-width:600px){
    .match-card{
        flex-direction:column;
        text-align:center;
    }
}
</style>
</head>

<body>

<div class="container">

<header>
    <h1>eFootball Manager</h1>
</header>

<div class="nav-tabs">
    <button class="tab-btn active" onclick="switchTab('championship', this)">
        Competição
    </button>
</div>

<div id="page-championship" class="page active">

    <div class="section-panel">
        <h2>Tabela de Classificação</h2>

        <div class="table-wrapper">
            <table>
                <thead>
                <tr>
                    <th>Pos</th>
                    <th>Equipe</th>
                    <th>J</th>
                    <th>V</th>
                    <th>E</th>
                    <th>D</th>
                    <th>GP</th>
                    <th>GC</th>
                    <th>SG</th>
                    <th>Pts</th>
                </tr>
                </thead>

                <tbody id="standings-body"></tbody>
            </table>
        </div>
    </div>

    <div class="section-panel">
        <h2>Partida</h2>

        <div class="match-card">

            <div class="match-teams">
                <img class="team-logo"
                     src="https://via.placeholder.com/24">
                <span>Flamengo</span>
            </div>

            <div class="score-box">
                <input type="number" class="score-input" value="2">
                x
                <input type="number" class="score-input" value="1">
            </div>

            <div class="match-teams away">
                <img class="team-logo"
                     src="https://via.placeholder.com/24">
                <span>Vasco</span>
            </div>

        </div>
    </div>

</div>

</div>

<script>

const teams = [
    {nome:"Flamengo", j:3, v:2, e:1, d:0, gp:8, gc:3},
    {nome:"Vasco", j:3, v:2, e:0, d:1, gp:6, gc:4},
    {nome:"Corinthians", j:3, v:1, e:1, d:1, gp:4, gc:4},
    {nome:"Palmeiras", j:3, v:1, e:0, d:2, gp:3, gc:5}
];

function loadTable(){

    const tbody = document.getElementById("standings-body");

    tbody.innerHTML = "";

    teams.forEach((team,index)=>{

        const pts = team.v * 3 + team.e;
        const sg = team.gp - team.gc;

        tbody.innerHTML += `
            <tr>
                <td>${index+1}</td>
                <td>${team.nome}</td>
                <td>${team.j}</td>
                <td>${team.v}</td>
                <td>${team.e}</td>
                <td>${team.d}</td>
                <td>${team.gp}</td>
                <td>${team.gc}</td>
                <td>${sg}</td>
                <td>${pts}</td>
            </tr>
        `;
    });
}

function switchTab(tabId, button){

    document.querySelectorAll(".page")
        .forEach(page => page.classList.remove("active"));

    document.querySelectorAll(".tab-btn")
        .forEach(btn => btn.classList.remove("active"));

    document.getElementById(`page-${tabId}`)
        .classList.add("active");

    button.classList.add("active");
}

loadTable();

</script>

</body>
</html>
